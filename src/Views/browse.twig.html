{% extends "base.twig.html" %}

{% block title %}Browse Internships{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Find Your Internship</h1>
  <p style="color: var(--text-light); margin-bottom: 0;">Discover amazing opportunities from partner companies</p>
</div>

<div id="browse-root" style="display: grid; grid-template-columns: 250px 1fr; gap: var(--spacing-2xl);">

  <!-- SIDEBAR FILTERS -->
  <aside id="sidebar" style="grid-row: 1 / 3;"></aside>

  <!-- MAIN CONTENT -->
  <div>
    <!-- TOP BAR -->
    <section id="browse-topbar"
      style="display: flex; gap: var(--spacing-lg); margin-bottom: var(--spacing-2xl); flex-wrap: wrap; align-items: center;">
      <div id="results-count" style="flex: 1; color: var(--text-light);"></div>
      <div id="search-bar" style="flex: 1; min-width: 250px;"></div>
      <div id="sort-dropdown" style="flex: 0 0 auto;"></div>
    </section>

    <!-- OFFERS GRID -->
    <section id="offers-grid" class="grid"></section>

    <!-- PAGINATION -->
    <div id="pagination"></div>
  </div>

</div>

<style>
  #browse-topbar input[type="text"] {
    border-radius: var(--radius-lg);
    padding: var(--spacing-md) var(--spacing-lg);
  }

  #browse-topbar select {
    padding: var(--spacing-md) var(--spacing-lg);
    border-radius: var(--radius-lg);
  }

  @media (max-width: 1024px) {
    #browse-root {
      grid-template-columns: 1fr;
    }

    #sidebar {
      grid-row: auto;
      grid-column: 1;
    }
  }
</style>

<!-- JS ENTRY -->
<script type="module" src="/static/js/browse.js"></script>

{% endblock %}
