{% extends "base.twig.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join us and find your internship</p>
    </div>

    <form method="POST" action="{{ baseUrl }}/signup">
        <div class="form-group">
            <div>
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required placeholder="John">
            </div>

            <div>
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required placeholder="Doe">
            </div>

            <div>
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" name="email" required placeholder="your@email.com">
            </div>

            <div>
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" required placeholder="••••••••">
            </div>

            <div>
                <label for="passwordConfirm">Confirm Password</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" required placeholder="••••••••">
            </div>

            <div>
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div>
                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value="">Select your country</option>
                    <option value="1">United States</option>
                    <option value="2">Canada</option>
                    <option value="3">United Kingdom</option>
                    <option value="4">Germany</option>
                    <option value="5">France</option>
                    <!-- Add more as needed -->
                </select>
            </div>

            <div>
                <label for="role">Account Type</label>
                <select id="role" name="role" required onchange="toggleStudentFields()">
                    <option value="">Select your role</option>
                    <option value="student">Student</option>
                    <option value="pilot">Pilot</option>
                </select>
            </div>

            <div id="studentFields" style="display: none;">
                <div>
                    <label for="schoolLevel">School Level</label>
                    <select id="schoolLevel" name="schoolLevel">
                        <option value="Bachelor">Bachelor</option>
                        <option value="Master">Master</option>
                        <option value="PhD">PhD</option>
                    </select>
                </div>

                <div>
                    <label for="schoolYear">School Year</label>
                    <input type="number" id="schoolYear" name="schoolYear" min="1" max="5" value="1">
                </div>

                <div>
                    <label for="major">Major</label>
                    <input type="text" id="major" name="major" placeholder="Computer Science">
                </div>

                <div>
                    <label for="pilot">Assigned Pilot</label>
                    <select id="pilot" name="pilot">
                        <option value="6">Olivia Martinez</option>
                        <!-- Add more pilots as needed -->
                    </select>
                </div>
            </div>

            <button type="submit" style="width: 100%; padding: var(--spacing-md);">Create Account</button>
        </div>
    </form>

    <div class="auth-footer">
        <p>Already have an account? <a href="{{ baseUrl }}/login">Sign in</a></p>
    </div>
</div>

<script src="static/js/pages/signup.js"></script>
{% endblock %}
