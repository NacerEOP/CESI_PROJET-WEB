<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style-header-footer.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/animations.css">
    <title>Browse Internships</title>
</head>

<body>
    <header>
        <nav class="nav-bar">

            <ul>
                <div class="centered-to-parent" id="nav-bg"></div>
                <li><a href="home.html">Home</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="help.html">Help</a></li>
            </ul>

            <img class="user-profile-picture" src="../assets/images/default-user-pfp.jpg">

        </nav>
    </header>


    <!-- Internship results -->
    <main>

        <section id="internship-list"></section>

        <div id="pagination"></div>

    </main>


<script>

function loadInternships(page = 1){

fetch(`../backend/get_internships.php?page=${page}`)
.then(res => res.json())
.then(data => {

const list = document.getElementById("internship-list");
const pagination = document.getElementById("pagination");

list.innerHTML = "";
pagination.innerHTML = "";

data.data.forEach(internship => {

const card = document.createElement("div");

card.className = "internship-card";

card.innerHTML = `
<h3>${internship.title}</h3>
<p><strong>Company:</strong> ${internship.company}</p>
<p><strong>Location:</strong> ${internship.location}</p>
`;

list.appendChild(card);

});

for(let i = 1; i <= data.totalPages; i++){

const btn = document.createElement("button");

btn.innerText = i;

btn.onclick = () => loadInternships(i);

pagination.appendChild(btn);

}

});

}

loadInternships();

</script>


</body>

</html>
