{% extends "base.twig.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Apply for Internship</h1>
    <p style="color: var(--text-light);">Submit your application and CV</p>
</div>

<div class="auth-container" style="max-width: 600px;">
    <form id="application-form" method="POST" enctype="multipart/form-data" action="upload-cv">
        <div class="form-group">
            <div>
                <label for="app-name">Full Name *</label>
                <input type="text" id="app-name" name="name" required placeholder="John Doe">
            </div>

            <div>
                <label for="app-email">Email Address *</label>
                <input type="email" id="app-email" name="email" required placeholder="your@email.com">
            </div>

            <div>
                <label for="app-cv">Upload Your CV (PDF/DOC/DOCX) *</label>
                <input type="file" id="app-cv" name="cv" accept=".pdf,.doc,.docx" required>
                <p style="font-size: 0.85rem; color: var(--text-light); margin-top: var(--spacing-sm);">Maximum file
                    size: 5 MB</p>
            </div>

            <button type="submit" style="width: 100%; padding: var(--spacing-md); margin-top: var(--spacing-lg);">Submit
                Application</button>
        </div>
    </form>

    <div id="app-message" style="margin-top: var(--spacing-lg);"></div>
</div>

<script src="static/js/pages/form.js"></script>
{% endblock %}
